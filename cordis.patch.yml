# Bundle patch for code-deep-dive-skill.
#
# Layer order matters: this patch is applied after the shipped bundles, and a
# matching `- id:` override REPLACES the whole config of that row. The
# skill-filesystem override below therefore restates the shipped agent-preset
# skills directory as well as this bundle's own directory. If your profile has
# customised that row (a non-default `includeDefaultRoots`, an extra root), add
# the equivalent lines here too, or the override will drop them.

# 1. Make the skill discoverable.
#    Skill roots are scanned as <root>/<name>/SKILL.md, so this bundle's own
#    package root is registered and code-deep-dive/SKILL.md is found inside it.
- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'
  config:
    customSkillDirs:
      - !!js process.getBuiltinModule('node:path').join(process.getBuiltinModule('node:path').dirname(process.getBuiltinModule('node:module').createRequire(baseUrl).resolve('@deepseek-ai/dsh-agent-preset/package.json')), 'skills')
      - !!js process.getBuiltinModule('node:path').dirname(process.getBuiltinModule('node:module').createRequire(baseUrl).resolve('code-deep-dive-skill/package.json'))

# 2. Wire the optional MCP code-analysis server.
#    The path is derived per user (DSH_HOME, else ~/.dsh) and per platform, so it
#    matches whatever scripts/setup-mcp.ps1 or scripts/setup-mcp.sh created.
#    If that virtualenv does not exist the connection simply fails and the tools
#    stay absent: failOnStartupError defaults to false, so the profile still loads
#    and the skill falls back to its degraded path.
- insert:
    - id: mcp-repodigest
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: repodigest
        transport: stdio
        command: !!js "(function () { const path = process.getBuiltinModule('node:path'); const os = process.getBuiltinModule('node:os'); const home = process.env.DSH_HOME || path.join(os.homedir(), '.dsh'); const venv = path.join(home, 'mcp-envs', 'repodigest'); return process.platform === 'win32' ? path.join(venv, 'Scripts', 'repodigest-mcp.exe') : path.join(venv, 'bin', 'repodigest-mcp'); })()"
        args: []
        # The server reads .py files with the process locale encoding. On a
        # non-UTF-8 locale (Chinese Windows is cp936) any non-ASCII character in
        # a source file aborts indexing and the tools report
        # 'No Python symbols found'. UTF-8 mode removes the whole class.
        env:
          PYTHONUTF8: '1'
